name: Deploy blog to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Checkout Zopfli
        uses: actions/checkout@v7
        with:
          repository: google/zopfli
          path: zopfli
      - name: Cache zopflipng
        id: zopflipng-cache
        uses: actions/cache@v4
        with:
          path: zopfli/zopflipng
          key: zopflipng-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zopfli/Makefile', 'zopfli/src/**') }}
      - name: Build zopflipng
        if: steps.zopflipng-cache.outputs.cache-hit != 'true'
        working-directory: zopfli
        run: make zopflipng -j2
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Cache PNG images
        id: png-cache
        uses: actions/cache@v6.1.0
        with:
          path: public/**/*.png
          key: png-${{ runner.os }}-${{ hashFiles('public/**/*.png') }}
      - name: Build lossless WebP images
        run: bash scripts/build-webp.sh public
      - name: Recompress PNG images with Zopfli
        if: steps.png-cache.outputs.cache-hit != 'true'
        run: |
          find public -type f -name '*.png' -print0 \
            | xargs -0 -r -P 4 -I{} ./zopfli/zopflipng --keepcolortype -m -y '{}' '{}'
      - name: Build static site
        run: |
          mkdir -p _site
          cp -a public/. _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
